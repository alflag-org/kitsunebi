[package]
name = "kitsunebi-gameap"
description = "GameAP execution backend adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink", "std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.8"

[lints]
workspace = true
