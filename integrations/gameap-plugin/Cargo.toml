[package]
name = "kitsunebi-gameap-process-manager-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "GameAP 4.4.2 process-manager capability extension"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gameap-plugin-sdk = { git = "https://github.com/gameap/gameap-proto.git", rev = "eb1f59723601e175e676ad91b6e9ae8eb89f80df" }

[profile.release]
opt-level = "z"
lto = true
strip = true

[workspace]
