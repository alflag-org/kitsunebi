[package]
name = "kitsunebi-application"
description = "Application use cases for Kitsunebi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kitsunebi-domain.workspace = true
async-trait = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
