[workspace]
resolver = "3"
members = [
    "crates/kitsunebi-domain",
    "crates/kitsunebi-application",
    "crates/kitsunebi-storage",
    "crates/kitsunebi-gameap",
    "crates/kitsunebi-tcpshield",
    "crates/kitsunebi-artifacts",
    "crates/kitsunebi-backup",
    "crates/kitsunebi-monitoring",
    "crates/kitsunebi-api",
    "crates/kitsunebi-controller",
    "crates/kitsunebi-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
kitsunebi-domain = { path = "crates/kitsunebi-domain" }
kitsunebi-application = { path = "crates/kitsunebi-application" }
kitsunebi-storage = { path = "crates/kitsunebi-storage" }
kitsunebi-gameap = { path = "crates/kitsunebi-gameap" }
kitsunebi-tcpshield = { path = "crates/kitsunebi-tcpshield" }
kitsunebi-artifacts = { path = "crates/kitsunebi-artifacts" }
kitsunebi-backup = { path = "crates/kitsunebi-backup" }
kitsunebi-api = { path = "crates/kitsunebi-api" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
